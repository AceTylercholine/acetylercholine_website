    <style>

    <div id="guilt-trip">Loading...</div>

    <div id="countdown">000d : 00h : 00m : 00s : 000ms</div>

    <div class="progress-label">Thesis Completion Progress:</div>
    <div class="progress-container">
        <div class="progress-bar">1.4%</div>
    </div>

    <div class="interaction-area" id="interaction-area">
        <button id="write-btn" onclick="alert('Good choice. Close this tab and open your manuscript.')">Write Your Thesis</button>
        <button id="procrastinate-btn">Click to Procrastinate</button>
    </div>

    <script>
        // 1. Academic Guilt-Trip Generator
        const guiltQuotes = [
            "Your PI is waiting.",
            "Are your figures formatted yet?",
            "That literature review won't write itself.",
            "Every second you waste is a second closer to a defense disaster.",
            "Shouldn't you be running stats on that dataset?",
            "Your reference manager is a mess and you know it.",
            "Another coffee won't write the discussion section."
        ];
        
        const guiltEl = document.getElementById("guilt-trip");
        function updateGuilt() {
            const randIndex = Math.floor(Math.random() * guiltQuotes.length);
            guiltEl.innerText = guiltQuotes[randIndex];
        }
        updateGuilt(); // initial call
        setInterval(updateGuilt, 5000); // Change text every 5 seconds

        // 2. Live Millisecond Countdown
        const targetDate = new Date("2027-03-31T00:00:00").getTime();
        const countdownEl = document.getElementById("countdown");

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff < 0) {
                countdownEl.innerText = "DEADLINE PASSED.";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const milliseconds = Math.floor((diff % 1000));

            countdownEl.innerText = 
                String(days).padStart(3, '0') + "d : " + 
                String(hours).padStart(2, '0') + "h : " + 
                String(minutes).padStart(2, '0') + "m : " + 
                String(seconds).padStart(2, '0') + "s : " + 
                String(milliseconds).padStart(3, '0') + "ms";
        }
        setInterval(updateCountdown, 10);

        // 3. Evasive Procrastination Button
        const procrastinateBtn = document.getElementById("procrastinate-btn");
        const area = document.getElementById("interaction-area");

        procrastinateBtn.addEventListener("mouseover", () => {
            const areaRect = area.getBoundingClientRect();
            const btnRect = procrastinateBtn.getBoundingClientRect();
            
            // Calculate boundaries to keep button inside the interaction area
            const maxX = areaRect.width - btnRect.width;
            const maxY = areaRect.height - btnRect.height;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            procrastinateBtn.style.left = randomX + "px";
            procrastinateBtn.style.top = randomY + "px";
            procrastinateBtn.style.transform = "none"; // Remove centering offset once it starts moving
        });
    </script>
